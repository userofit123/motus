# Motus on your own server.
#   cp .env.example .env   (set a database password)
#   docker compose up -d
# The app listens on 127.0.0.1:8790; put a reverse proxy with HTTPS in front (see docs/self-hosting.md).
name: motus-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: motus
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: motus
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motus -d motus"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  app:
    image: ghcr.io/userofit123/motus:${MOTUS_VERSION:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://motus:${DB_PASSWORD}@db:5432/motus
      LOG: "1"
    volumes:
      - appdata:/data
    ports:
      - "127.0.0.1:${MOTUS_PORT:-8790}:8080"
    depends_on:
      db: { condition: service_healthy }
    networks: [backend, web]
    labels:
      - com.centurylinklabs.watchtower.enable=true

volumes:
  db: {}
  appdata: {}

networks:
  backend:
    internal: true # the database is never reachable from outside
  web: {}
