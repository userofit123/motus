<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17100d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Motus" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icon-maskable-192.png" />
    <title>Motus</title>
    <!-- Before the first paint: the saved look (so there is no flash) and the phone/desktop layout. -->
    <script>try{var T=JSON.parse(localStorage.getItem("motusTheme")||"{}"),h=document.documentElement;["bg","tex","rad","den","spc","nsp","fnt","nav"].forEach(function(k){if(T[k])h.dataset[k]=T[k]});var b=JSON.parse(localStorage.getItem("motusBoot")||"null");h.style.background=b?b.bg:"#17100d";h.style.colorScheme=!b||b.d?"dark":"light";if(b){h.style.setProperty("--sp1",b.a1);h.style.setProperty("--sp2",b.a2)}}catch(e){}
    (function(){var L=localStorage.getItem("motusLayout")||"auto",w=Math.min(innerWidth,document.documentElement.clientWidth||innerWidth),t=matchMedia("(pointer:coarse)").matches;document.documentElement.classList.toggle("phone",L=="phone"||(L=="auto"&&(w<=860||(t&&w<=1100))))})();</script>
    <style>#splash{position:fixed;inset:0;display:grid;place-items:center}#splash .logo{--lgc:var(--sp1,#2a9bd6);width:56px;height:56px;border-radius:18px;margin:0;animation:spl 1.2s ease-in-out infinite}@keyframes spl{50%{transform:scale(.92);opacity:.7}}</style>
  </head>
  <body>
    <div id="app"><div id="splash"><div class="logo"><svg viewBox="0 0 512 512"><g transform="translate(256 250) rotate(-45) scale(.98)"><rect x="-184" y="-19" width="368" height="38" rx="19"/><rect x="-128" y="-108" width="56" height="216" rx="18"/><rect x="72" y="-108" width="56" height="216" rx="18"/><rect x="-170" y="-74" width="50" height="148" rx="16"/><rect x="120" y="-74" width="50" height="148" rx="16"/><rect class="hl" x="-116" y="-88" width="10" height="72" rx="5"/><rect class="hl" x="84" y="-88" width="10" height="72" rx="5"/></g></svg></div></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
