# Checks every push and pull request: types, engine tests (including the data-isolation tests) and the web build.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @motus/engine test
      - run: pnpm --filter @motus/web exec vue-tsc --noEmit
      - run: pnpm --filter @motus/web exec vite build
